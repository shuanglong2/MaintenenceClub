name: CI

on:
  push:
    paths-ignore:
      - "Docs/**"
  pull_request:
    paths-ignore:
      - "Docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOAMD64: v1
  GOCACHE: ${{ github.workspace }}/.gocache
  GOMODCACHE: ${{ github.workspace }}/.gomodcache
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mclub
          POSTGRES_PASSWORD: mclub
          POSTGRES_DB: mclub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mclub -d mclub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MCLUB_TEST_DSN: postgres://mclub:mclub@127.0.0.1:5432/mclub?sslmode=disable
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 缓存模块与构建
        uses: actions/cache@v6
        with:
          path: |
            .gomodcache
            .gocache
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: 显示 Go
        run: go version

      - name: 检查格式
        run: |
          unformatted="$(gofmt -l Src)"
          if [ -n "$unformatted" ]; then
            echo "需要 gofmt:"
            echo "$unformatted"
            gofmt -d Src
            exit 1
          fi

      - name: 整理模块文件
        id: tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备模块产物
        if: steps.tidy.outputs.changed == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/gomod"
          cp go.mod "${RUNNER_TEMP}/gomod/go.mod"
          if [ -f go.sum ]; then
            cp go.sum "${RUNNER_TEMP}/gomod/go.sum"
          fi

      - name: 上传 go.mod 与 go.sum
        if: steps.tidy.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-mod
          path: ${{ runner.temp }}/gomod
          if-no-files-found: error

      - name: 要求提交模块文件
        if: steps.tidy.outputs.changed == 'true'
        run: |
          echo "go.mod 或 go.sum 与仓库不一致. 请下载 artifact go-mod 后提交."
          git status --porcelain -- go.mod go.sum
          exit 1

      - name: 检查代码
        run: go vet ./...

      - name: 测试
        run: go test ./...

      - name: 竞态测试
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: staticcheck
        run: |
          mkdir -p .bin
          GOBIN="${GITHUB_WORKSPACE}/.bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          .bin/staticcheck ./...
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "staticcheck 改动了模块文件"
            exit 1
          fi

      - name: 编译 linux-x64 与 win-x64
        run: |
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          version="dev"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          meta="-X github.com/shuanglong2/MaintenenceClub/Src/internal/shared/buildinfo.Version=${version} -X github.com/shuanglong2/MaintenenceClub/Src/internal/shared/buildinfo.Commit=${GITHUB_SHA} -X github.com/shuanglong2/MaintenenceClub/Src/internal/shared/buildinfo.Built=${built}"
          mkdir -p Publish/linux-x64 Publish/win-x64
          GOOS=linux GOARCH=amd64 go build \
            -ldflags="${meta}" \
            -o Publish/linux-x64/mclub ./Src/cmd/mclub
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -buildid= ${meta}" \
            -o Publish/win-x64/mclub.exe ./Src/cmd/mclub

      - name: 检查编译结果
        run: |
          test -x Publish/linux-x64/mclub
          test -f Publish/win-x64/mclub.exe
          file Publish/linux-x64/mclub
          file Publish/win-x64/mclub.exe
          go version -m Publish/linux-x64/mclub | tee "${RUNNER_TEMP}/linux-version.txt" | grep -q "GOAMD64=v1"
          go version -m Publish/win-x64/mclub.exe | grep -q "GOAMD64=v1"
          ls -l Publish/linux-x64/mclub Publish/win-x64/mclub.exe | tee "${RUNNER_TEMP}/size.txt"

      - name: 记录体积
        run: |
          {
            echo "### 编译结果"
            echo ""
            echo '```'
            cat "${RUNNER_TEMP}/size.txt"
            echo '```'
            echo "构建信息:"
            echo '```'
            cat "${RUNNER_TEMP}/linux-version.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 冒烟
        run: |
          set -eu
          export MCLUB_ADDR=127.0.0.1:18080
          export MCLUB_DB="${MCLUB_TEST_DSN}"
          export MCLUB_DATA="${RUNNER_TEMP}/uploads"
          bin="Publish/linux-x64/mclub"
          "$bin" version
          "$bin" migrate
          "$bin" migrate
          "$bin" serve > "${RUNNER_TEMP}/mclub.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 100); do
            if curl -fsS "http://127.0.0.1:18080/healthz" | grep -q '"database":"ok"'; then
              ok=1
              break
            fi
            sleep 0.2
          done
          if [ "$ok" != 1 ]; then
            echo "健康检查失败"
            cat "${RUNNER_TEMP}/mclub.log"
            exit 1
          fi
          curl -fsS "http://127.0.0.1:18080/" | grep -q "维修组"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/missing")"
          test "$code" = "404"
          kill "$pid"
          wait "$pid" || true

      - name: 上传编译结果
        uses: actions/upload-artifact@v7
        with:
          name: Publish
          path: |
            Publish/linux-x64/mclub
            Publish/win-x64/mclub.exe
          if-no-files-found: error

  prune-cache:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 移除无用缓存
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: go-${{ runner.os }}-${{ hashFiles('go.sum', 'go.mod') }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .key] | @tsv' |
            while IFS="$(printf '\t')" read -r id key; do
              if [ -z "$id" ] || [ "$key" = "$KEEP" ]; then
                continue
              fi
              echo "delete ${id} ${key}"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            done
