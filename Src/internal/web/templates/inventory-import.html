{{define "inventory-import-body"}}
<h1>导入物品</h1>
{{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
<p><a href="/inventory/template.csv">下载模板</a></p>
<p class="hint">表头是 编号, 名称, 类别, 规格, 单位, 位置, 最低库存, 逐件, 数量, 备注. 位置直接写箱子名, 例如 A箱. 类别是 器材, 工具, 消耗品, 元件. 逐件填 是 或 否.</p>
<form class="stack" method="post" action="/inventory/import" enctype="multipart/form-data">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>CSV 文件<input type="file" name="file" accept=".csv,text/csv" required></label>
<button type="submit">导入</button>
</form>
{{end}}
