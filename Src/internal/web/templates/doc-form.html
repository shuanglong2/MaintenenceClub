{{define "doc-form-body"}}
<link rel="stylesheet" href="{{static "vditor/dist/index.css"}}">
<div class="docs-app">
{{template "doc-side" .}}
<div class="doc-main">
{{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<div class="doc-bar">
<div class="modes">
<button type="button" data-mode-set="ir" {{if ne .Doc.Mode "sv"}}class="on"{{end}}>自动</button>
<button type="button" data-mode-set="sv" {{if eq .Doc.Mode "sv"}}class="on"{{end}}>编辑</button>
<a data-read href="/docs/p/{{.Doc.Page.ID}}">阅读</a>
</div>
<div class="format">
<label>段落
<select id="doc-block">
<option value="">段落</option>
<option value="0">正文</option>
<option value="1">一级标题</option>
<option value="2">二级标题</option>
<option value="3">三级标题</option>
</select>
</label>
<button type="button" data-cmd="math">公式</button>
<button type="button" data-cmd="bold">加粗</button>
<button type="button" data-cmd="mark">重点</button>
<button type="button" data-cmd="under">下划线</button>
<button type="button" data-cmd="table">表格</button>
<button type="button" data-cmd="image">图片</button>
<button type="submit" form="doc-form">保存</button>
</div>
</div>
<form id="doc-form" class="stack" method="post" action="/docs/p/{{.Doc.Page.ID}}">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<input type="hidden" name="version" value="{{.Doc.Draft.Version}}">
<input class="doc-title" name="title" value="{{.Doc.Draft.Title}}" required maxlength="80" aria-label="标题">
<div class="doc-meta">
<label>目录
<select name="folder">
<option value="0">不放入目录</option>
{{range .Doc.Folders}}<option value="{{.ID}}" {{if eq .ID $.Doc.Draft.FolderID}}selected{{end}}>{{.Name}}</option>{{end}}
</select>
</label>
{{if .Doc.Management}}
<label>可见范围
<select name="visibility">
<option value="all" {{if ne .Doc.Draft.Visibility "management"}}selected{{end}}>全员</option>
<option value="management" {{if eq .Doc.Draft.Visibility "management"}}selected{{end}}>仅管理层</option>
</select>
</label>
{{else}}
<input type="hidden" name="visibility" value="{{if .Doc.Draft.Visibility}}{{.Doc.Draft.Visibility}}{{else}}all{{end}}">
{{end}}
<label>标签<input name="tags" value="{{.Doc.Tags}}" placeholder="用逗号分隔"></label>
</div>
<textarea class="markdown-source" id="doc-body" name="body">{{.Doc.Draft.Body}}</textarea>
<input id="doc-image" type="file" accept="image/*">
<div id="doc-editor" data-mode="{{if .Doc.Mode}}{{.Doc.Mode}}{{else}}ir{{end}}"></div>
</form>
<p class="hint">自动直接看到排好的样子. 编辑看 Markdown 源码. 公式用 $ 或 $$ , 也可点「公式」.</p>
</div>
</div>
<script src="{{static "vditor/dist/index.min.js"}}"></script>
<script src="{{static "docs.js"}}"></script>
{{end}}
