{{define "search-body"}}
<h1>搜索</h1>
<form class="stack" method="get" action="/search">
<label>关键词<input name="q" value="{{.Find.Query}}" maxlength="40"></label>
<button type="submit">搜索</button>
</form>
{{range .Find.Groups}}
<section class="widget">
<h2>{{.Title}}</h2>
{{if .Hits}}
<ul>
{{range .Hits}}<li><a class="search-hit" href="{{.Href}}">{{.Label}}</a></li>{{end}}
</ul>
{{else}}
<p class="empty">没有结果.</p>
{{end}}
</section>
{{end}}
{{end}}
