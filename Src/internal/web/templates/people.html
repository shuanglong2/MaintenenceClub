{{define "people-body"}}
<h1>人员</h1>
{{if .ShowManage}}<p class="tools"><a class="go" href="/people/new">新建</a> <a href="/people/import">导入</a></p>{{end}}
{{if not .People}}<p class="empty">还没有人员.</p>{{else}}
<div class="people-grid">
{{range .People}}
<a class="person-card" href="/people/{{.ID}}">
{{if .AvatarID}}<img src="/files/{{.AvatarID}}" alt="">{{end}}
<strong>{{.Name}}</strong>
<span>{{.RoleLabel}} · {{.StatusLabel}}</span>
{{if .ClassName}}<small>{{.ClassName}}</small>{{end}}
{{if $.ShowAudit}}<small>{{.Login}}</small>{{end}}
</a>
{{end}}
</div>
{{end}}
{{end}}
