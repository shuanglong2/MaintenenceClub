{{define "doc-body"}}
<link rel="stylesheet" href="{{static "vditor/dist/index.css"}}">
<div class="docs-app">
{{template "doc-side" .}}
<div class="doc-main">
<div class="doc-bar">
<div class="modes">
<a href="/docs/p/{{.Doc.Page.ID}}/edit?mode=ir">自动</a>
<a href="/docs/p/{{.Doc.Page.ID}}/edit?mode=sv">编辑</a>
<a href="/docs/p/{{.Doc.Page.ID}}" aria-current="page">阅读</a>
</div>
<p class="tools">
<a href="/docs/p/{{.Doc.Page.ID}}/history">历史</a>
<a href="/docs/p/{{.Doc.Page.ID}}.md">原文</a>
</p>
</div>
<h1>{{.Doc.Page.Title}}</h1>
{{if .Doc.Page.Voided}}<p class="notice">已作废: {{.Doc.Page.VoidReason}}</p>{{end}}
{{if .Doc.Page.Tags}}<p class="hint">{{range .Doc.Page.Tags}}<span>{{.}} </span>{{end}}</p>{{end}}
<textarea class="markdown-source" id="doc-source">{{.Doc.Page.Body}}</textarea>
<div id="doc-preview" class="prose"></div>
{{if not .Doc.Page.Voided}}
<details class="danger">
<summary>作废这篇文档</summary>
<form class="stack" method="post" action="/docs/p/{{.Doc.Page.ID}}/void">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label>作废原因<input name="reason" required></label>
<button type="submit">作废</button>
</form>
</details>
{{else if .Doc.Management}}
<form method="post" action="/docs/p/{{.Doc.Page.ID}}/unvoid">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button type="submit">恢复</button>
</form>
{{end}}
</div>
</div>
<script src="{{static "vditor/dist/method.min.js"}}"></script>
<script src="{{static "docs.js"}}"></script>
{{end}}
