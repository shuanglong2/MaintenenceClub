{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{static "app.css"}}">
</head>
<body>
<header class="top">
<a class="brand" href="/">维修组</a>
{{if .User}}
{{if not .User.MustChange}}
<nav>
<a href="/" {{if navOn .Path "/"}}aria-current="page"{{end}}>主页</a>
<a href="/docs" {{if navOn .Path "/docs"}}aria-current="page"{{end}}>文档</a>
<a href="/events" {{if navOn .Path "/events"}}aria-current="page"{{end}}>日程</a>
<a href="/tasks" {{if navOn .Path "/tasks"}}aria-current="page"{{end}}>任务</a>
<a href="/activities" {{if navOn .Path "/activities"}}aria-current="page"{{end}}>活动</a>
<a href="/competitions" {{if navOn .Path "/competitions"}}aria-current="page"{{end}}>竞赛</a>
<a class="desk-only" href="/inventory" {{if navOn .Path "/inventory"}}aria-current="page"{{end}}>库存</a>
<a class="desk-only" href="/logs" {{if navOn .Path "/logs"}}aria-current="page"{{end}}>记录</a>
<a href="/people" {{if navOn .Path "/people"}}aria-current="page"{{end}}>人员</a>
{{if .Finance}}<a class="desk-only" href="/finance" {{if navOn .Path "/finance"}}aria-current="page"{{end}}>财务</a>{{end}}
{{if .ShowAudit}}<a class="desk-only" href="/audit" {{if navOn .Path "/audit"}}aria-current="page"{{end}}>审计</a>{{end}}
{{if .ShowManage}}<a class="desk-only" href="/system" {{if navOn .Path "/system"}}aria-current="page"{{end}}>状态</a>{{end}}
{{if .ShowManage}}<a class="desk-only" href="/settings" {{if navOn .Path "/settings"}}aria-current="page"{{end}}>设置</a>{{end}}
</nav>
{{end}}
<div class="account">
<a href="/account" {{if navOn .Path "/account"}}aria-current="page"{{end}}>我的</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit">退出</button></form>
</div>
{{else}}
<nav><a href="/login">登录</a></nav>
{{end}}
</header>
<main>{{.HTML}}</main>
<script src="{{static "dialog.js"}}"></script>
<script src="{{static "htmx.min.js"}}"></script>
</body>
</html>
{{end}}
