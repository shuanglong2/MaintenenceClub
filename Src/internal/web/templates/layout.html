{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="{{static "app.css"}}">
</head>
<body>
<header class="top">
<a class="brand" href="/">维修组</a>
<nav>
{{if .User}}
{{if not .User.MustChange}}<a href="/docs">文档</a><a href="/people">人员</a>{{end}}
{{if and .ShowAudit (not .User.MustChange)}}<a href="/audit">审计</a>{{end}}
<a href="/account">我的</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit">退出</button></form>
{{else}}
<a href="/login">登录</a>
{{end}}
</nav>
</header>
<main>{{.HTML}}</main>
<script src="{{static "htmx.min.js"}}"></script>
</body>
</html>
{{end}}
